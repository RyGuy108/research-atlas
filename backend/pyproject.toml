[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-atlas-api"
version = "0.1.0"
description = "API for conference-aware research discovery and evaluation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.135,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.13,<3.0",
  "scikit-learn>=1.8,<2.0",
  "sqlalchemy[asyncio]>=2.0.51,<3.0",
  "uvicorn[standard]>=0.41,<1.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.22,<1.0",
  "mypy>=1.19,<2.0",
  "pytest>=9.0,<10.0",
  "ruff>=0.15,<1.0",
]
ml = [
  "sentence-transformers>=5.2,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "sklearn.*"]
ignore_missing_imports = true
