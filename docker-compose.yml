services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_atlas}
      POSTGRES_USER: ${POSTGRES_USER:-research_atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_atlas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research_atlas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-3}
      CROSS_ENCODER_ENABLED: ${CROSS_ENCODER_ENABLED:-false}
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      CROSS_ENCODER_DEVICE: ${CROSS_ENCODER_DEVICE:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://research_atlas:research_atlas@database:5432/research_atlas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    command: python -m app.worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-3}
      CROSS_ENCODER_ENABLED: ${CROSS_ENCODER_ENABLED:-false}
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      CROSS_ENCODER_DEVICE: ${CROSS_ENCODER_DEVICE:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://research_atlas:research_atlas@database:5432/research_atlas}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
